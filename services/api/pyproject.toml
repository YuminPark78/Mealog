[project]
name = "mealog-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yumin Park", email = "yumin.park02@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.1",
    "pydexcom>=0.5.1",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mealog-api = "mealog_api:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"

[tool.pyright]
venvPath = "."
venv = ".venv"


